[project]
name = "linguadventure"
version = "0.1.0"
description = "LinguAdventure explores how generative AI, speech technology, persistent memory, and adaptive learner modelling can be combined to create an engaging spoken-language learning experience."
readme = "README.md"
authors = [
    { name = "Martin Gorren", email = "Martin.Gorren@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "dotenv>=0.9.9",
    "flask-login>=0.6.3",
    "flask-sqlalchemy>=3.1.1",
    "openai>=3.42.1",
    "sqlalchemy>=2.1.6",
]

[project.scripts]
linguadventure = "linguadventure:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/unit_test"]
